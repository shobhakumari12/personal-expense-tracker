
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="content">
        <section class="panel">
            <h1>Edit Transaction</h1>

            <form method="POST" class="transaction-form">
                <label>
                    Description
                    <input type="text" name="title"
                           value="{{ transaction.title }}" required>
                </label>

                <label>
                    Amount (₹)
                    <input type="number" name="amount" min="0.01"
                           step="0.01" value="{{ transaction.amount }}"
                           required>
                </label>

                <label>
                    Type
                    <select name="transaction_type" required>
                        <option value="income"
                            {% if transaction.transaction_type == 'income' %}selected{% endif %}>
                            Income
                        </option>
                        <option value="expense"
                            {% if transaction.transaction_type == 'expense' %}selected{% endif %}>
                            Expense
                        </option>
                    </select>
                </label>

                <label>
                    Category
                    <input type="text" name="category"
                           value="{{ transaction.category }}" required>
                </label>

                <label>
                    Date
                    <input type="date" name="transaction_date"
                           value="{{ transaction.transaction_date }}" required>
                </label>

                <button type="submit">Save Changes</button>
            </form>

            <p><a href="{{ url_for('home') }}">Back to Dashboard</a></p>
        </section>
    </main>
</body>
</html>
